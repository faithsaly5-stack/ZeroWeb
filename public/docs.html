<script>
// --- Shared shell: nav + theme + scroll ---
(function(){
  const nav = document.getElementById('nav');
  const scrollBar = document.getElementById('scroll-bar');
  const backTop = document.getElementById('back-to-top');
  const navToggle = document.getElementById('nav-toggle');
  const navMenu = document.getElementById('nav-menu');
  let ticking = false;
  function onScroll(){
    const y = window.scrollY;
    const docH = document.documentElement.scrollHeight - window.innerHeight;
    if(nav) nav.classList.toggle('scrolled', y > 20);
    if(scrollBar) scrollBar.style.transform = 'scaleX('+(docH>0 ? (y/docH) : 0).toFixed(4)+')';
    if(backTop) backTop.classList.toggle('show', y > 500);
    ticking = false;
  }
  window.addEventListener('scroll', ()=>{ if(!ticking){ requestAnimationFrame(onScroll); ticking=true; } }, {passive:true});
  onScroll();
  if(backTop) backTop.addEventListener('click', ()=> window.scrollTo({top:0, behavior:'smooth'}));
  if(navToggle && navMenu){
    navToggle.addEventListener('click', ()=>{ const o=navMenu.classList.toggle('open'); navToggle.classList.toggle('open',o); navToggle.setAttribute('aria-expanded', o?'true':'false'); });
    navMenu.querySelectorAll('a').forEach(a=>a.addEventListener('click', ()=>{ navMenu.classList.remove('open'); navToggle.classList.remove('open'); }));
  }
  const themeToggleBtn = document.getElementById('theme-toggle');
  if(themeToggleBtn){
    themeToggleBtn.addEventListener('click', ()=>{
      document.documentElement.classList.toggle('light-theme');
      try{ localStorage.setItem('theme', document.documentElement.classList.contains('light-theme')?'light':'dark'); }catch(e){}
  if (window.__SITE_CONFIG__) {
    const c = window.__SITE_CONFIG__;
    if (c.BRAND_LOGO_TEXT) { const el = document.getElementById('brand-name'); if (el) el.textContent = c.BRAND_LOGO_TEXT; }
    if (c.BRAND_LOGO_SUBTITLE) { const el = document.getElementById('brand-sub'); if (el) el.textContent = c.BRAND_LOGO_SUBTITLE; }
  }
})();

// --- Docs logic ---
let allNotes = [];
let categoriesMap = {};
const loader = document.getElementById('notes-loader');
const emptyMsg = document.getElementById('notes-empty');
const searchInput = document.getElementById('search-input');
const viewCategories = document.getElementById('view-categories');
const viewNotes = document.getElementById('view-notes');
const viewSearch = document.getElementById('view-search');

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

async function loadNotes() {
  loader.style.display = 'block';
  try {
    let res = await fetch('/api/docs_list?t=' + Date.now());
    if (!res.ok) throw new Error('Not found');
    allNotes = await res.json();
    loader.style.display = 'none';
    processCategories();
    if (searchInput.value.trim()) performSearch(searchInput.value.trim());
    else renderCategories();
  } catch (e) {
    loader.style.display = 'none';
    emptyMsg.style.display = 'block';
    emptyMsg.innerHTML = 'خطا در دریافت لیست مستندات و مقالات.';
    console.error('Failed to load notes', e);
  }
}

function processCategories() {
  categoriesMap = {};
  if (!allNotes || allNotes.length === 0) return;
  allNotes.forEach(note => {
    const cat = note.category || '📁 دسته‌بندی عمومی';
    if (!categoriesMap[cat]) categoriesMap[cat] = [];
    categoriesMap[cat].push(note);
  });
}

function parseCategoryName(fullName) {
  const emojiRegex = /^([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/;
  const match = (fullName||'').trim().match(emojiRegex);
  if (match) return { emoji: match[1], text: fullName.replace(match[1], '').trim() };
  return { emoji: '📚', text: fullName };
}

function renderCategories() {
  switchView('categories');
  const grid = document.getElementById('categories-grid');
  grid.innerHTML = '';
  const cats = Object.keys(categoriesMap);
  if (cats.length === 0) {
    emptyMsg.style.display = 'block';
    return;
  }
  emptyMsg.style.display = 'none';
  cats.forEach(catName => {
    const items = categoriesMap[catName];
    const { emoji, text } = parseCategoryName(catName);
    const card = document.createElement('div');
    card.className = 'category-card';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', text + ' (' + items.length + ' مورد)');
    card.innerHTML =
      '<div class="cat-card-top">' +
        '<div class="cat-icon-badge">' + emoji + '</div>' +
        '<span class="cat-count">' + items.length.toLocaleString('fa-IR') + ' مستند</span>' +
      '</div>' +
      '<div class="cat-card-body">' +
        '<h3 class="cat-title">' + esc(text) + '</h3>' +
      '</div>' +
      '<div class="cat-card-footer">' +
        '<span class="cat-action">مشاهده مستندات ←</span>' +
      '</div>';
    const openCat = () => openCategory(catName);
    card.addEventListener('click', openCat);
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCat(); } });
    grid.appendChild(card);
  });
}

let currentActiveCategory = null;
function openCategory(catName) {
  currentActiveCategory = catName;
  switchView('notes');
  const { text } = parseCategoryName(catName);
  document.getElementById('current-category-title').textContent = text;
  renderPaginatedNotes(categoriesMap[catName] || [], 'category-notes-grid', 'category-pagination', 1);
  window.scrollTo({ top: 120, behavior: 'smooth' });
}

function backToCategories() {
  currentActiveCategory = null;
  searchInput.value = '';
  renderCategories();
}

function switchView(viewName) {
  viewCategories.classList.remove('active');
  viewNotes.classList.remove('active');
  viewSearch.classList.remove('active');
  if (viewName === 'categories') viewCategories.classList.add('active');
  if (viewName === 'notes') viewNotes.classList.add('active');
  if (viewName === 'search') viewSearch.classList.add('active');
}

const PAGE_SIZE = 12;
function renderPaginatedNotes(notesList, gridId, paginationId, page) {
  const grid = document.getElementById(gridId);
  const pagination = document.getElementById(paginationId);
  grid.innerHTML = '';
  pagination.innerHTML = '';
  if (!notesList || notesList.length === 0) {
    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-light); padding: 40px 0;">موردی یافت نشد.</div>';
    return;
  }
  const totalPages = Math.ceil(notesList.length / PAGE_SIZE);
  const currentPage = Math.max(1, Math.min(page, totalPages));
  const startIdx = (currentPage - 1) * PAGE_SIZE;
  const currentNotes = notesList.slice(startIdx, startIdx + PAGE_SIZE);

  currentNotes.forEach(note => {
    const card = document.createElement('a');
    card.className = 'note-card';
    card.href = note.path || '#';
    let excerpt = (note.text || '').replace(/\s+/g, ' ').trim();
    if (excerpt.length > 120) excerpt = excerpt.substring(0, 120) + '...';
    const isDoc = note.is_file;
    const badgeLabel = isDoc ? (note.type || 'فایل') : 'مستند';
    const actionLabel = isDoc ? 'دریافت فایل' : 'مطالعه مستند';
    card.innerHTML =
      '<div class="note-card-top">' +
        '<span class="note-pill">' + (isDoc ? '📎 ' : '📄 ') + esc(badgeLabel) + '</span>' +
      '</div>' +
      '<h3 class="note-title">' + esc(note.title) + '</h3>' +
      '<p class="note-desc">' + esc(excerpt) + '</p>' +
      '<div class="note-footer">' +
        '<span class="note-action">' + actionLabel + ' ←</span>' +
      '</div>';
    grid.appendChild(card);
  });

  if (totalPages > 1) {
    const prevBtn = document.createElement('button');
    prevBtn.className = 'page-btn';
    prevBtn.disabled = currentPage === 1;
    prevBtn.textContent = 'قبلی';
    prevBtn.onclick = () => renderPaginatedNotes(notesList, gridId, paginationId, currentPage - 1);
    pagination.appendChild(prevBtn);

    for (let i = 1; i <= totalPages; i++) {
      const pageBtn = document.createElement('button');
      pageBtn.className = 'page-btn' + (i === currentPage ? ' active' : '');
      pageBtn.textContent = i.toLocaleString('fa-IR');
      pageBtn.onclick = () => renderPaginatedNotes(notesList, gridId, paginationId, i);
      pagination.appendChild(pageBtn);
    }

    const nextBtn = document.createElement('button');
    nextBtn.className = 'page-btn';
    nextBtn.disabled = currentPage === totalPages;
    nextBtn.textContent = 'بعدی';
    nextBtn.onclick = () => renderPaginatedNotes(notesList, gridId, paginationId, currentPage + 1);
    pagination.appendChild(nextBtn);
  }
}

let searchTimeout = null;
let activeSearchList = [];
function performSearch(query) {
  if (!query) {
    if (currentActiveCategory) openCategory(currentActiveCategory);
    else renderCategories();
    return;
  }
  switchView('search');
  activeSearchList = allNotes.filter(n => {
    const titleMatch = (n.title || '').toLowerCase().includes(query);
    const textMatch = (n.text || '').toLowerCase().includes(query);
    const catMatch = (n.category || '').toLowerCase().includes(query);
    return titleMatch || textMatch || catMatch;
  });
  renderPaginatedNotes(activeSearchList, 'search-notes-grid', 'search-pagination', 1);
  const cntEl = document.getElementById('search-count');
  if (cntEl) cntEl.textContent = activeSearchList.length.toLocaleString('fa-IR');
}
searchInput.addEventListener('input', (e) => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => performSearch(e.target.value.trim().toLowerCase()), 300);
});

document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const typing = document.activeElement === searchInput;
  if (e.key === '/' && !typing) { e.preventDefault(); searchInput.focus(); }
  else if (e.key === 'Escape' && typing) { searchInput.value=''; performSearch(''); searchInput.blur(); }
});

// --- Canvas background ---
let canvas, ctx, particles = [];
function initCanvasBg() {
  canvas = document.getElementById('canvas-bg'); if (!canvas) return;
  ctx = canvas.getContext('2d'); canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  particles = [];
  const count = window.innerWidth < 768 ? 10 : 24;
  const isLight = document.documentElement.classList.contains('light-theme');
  const color = isLight ? 'rgba(5,150,105,0.08)' : 'rgba(52,211,153,0.12)';
  for (let i = 0; i < count; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*1.8+0.8, speedX: Math.random()*0.4-0.2, speedY: Math.random()*0.4-0.2, color });
}
let __cvLast = 0, __cvHidden = false;
document.addEventListener('visibilitychange', () => { __cvHidden = document.hidden; });
function animateCanvas(now) {
  if (!ctx) return;
  requestAnimationFrame(animateCanvas);
  if (__cvHidden) return;
  if (now - __cvLast < 33) return;
  __cvLast = now;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => { p.x += p.speedX; p.y += p.speedY; if (p.x<0)p.x=canvas.width; if (p.x>canvas.width)p.x=0; if (p.y<0)p.y=canvas.height; if (p.y>canvas.height)p.y=0; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); });
}
document.addEventListener('DOMContentLoaded', () => { try { var _q=new URLSearchParams(location.search).get('q'); if(_q && searchInput){ searchInput.value=_q; } } catch(e){} initCanvasBg(); animateCanvas(); loadNotes(); });
window.addEventListener('resize', initCanvasBg, { passive: true });
</script>
