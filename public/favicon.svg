<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ساخت وب‌سایت رایگان">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="icon-grad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="60" height="60" x="2" y="2" rx="14" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Cloud / Web Symbol -->
  <g fill="none" stroke="url(#icon-grad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M22 41 h20 a7.5 7.5 0 0 0 1.5 -14.8 A10.5 10.5 0 0 0 23 23 a8 8 0 0 0 -4.5 14.5 A5.5 5.5 0 0 0 22 41 z" fill="rgba(56, 189, 248, 0.12)"/>
    <path d="M29 32 l-2.5 2.5 2.5 2.5" stroke="#38bdf8" stroke-width="2.2"/>
    <path d="M35 32 l2.5 2.5 -2.5 2.5" stroke="#c084fc" stroke-width="2.2"/>
  </g>
  <circle cx="48" cy="18" r="2.5" fill="#38bdf8"/>
  <circle cx="16" cy="46" r="2" fill="#818cf8"/>
</svg>
